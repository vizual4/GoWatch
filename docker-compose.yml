services:
  postgres:
    image: postgres:16-alpine
    container_name: gowatch-postgres
    environment:
      POSTGRES_USER: gowatch_user
      POSTGRES_PASSWORD: gowatch_pass
      POSTGRES_DB: gowatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Данные будут сохраняться на диске!

volumes:
  postgres_data: # Объявляем постоянный том